name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment and quality tools
        run: uv sync --locked --extra quality
      - name: Unit and integration tests
        run: uv run pytest -q
      - name: Static security scan
        run: uv run bandit -r mibici
      - name: Dependency vulnerability audit
        run: uv run pip-audit
