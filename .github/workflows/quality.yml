name: Quality

on:
  push:
  pull_request:

jobs:
  tests:
    name: Pytest and DeepChecks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  security:
    name: Bandit security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Bandit
        run: uv pip install bandit

      - name: Run Bandit
        run: uv run bandit -r mibici -x "*/__pycache__/*" --severity-level high