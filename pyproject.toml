[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Team40" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "deepchecks>=0.19.1",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mlflow>=3.17.1",
    "notebook",
    "numpy<2",
    "pandas",
    "pip",
    "pyarrow>=25.0.1",
    "pytest",
    "python-dotenv",
    "PyYAML==6.0.3",
    "ruff",
    "scikit-learn",
    "setuptools<81",
    "tqdm",
    "typer",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "ipykernel>=7.3.0",
]

