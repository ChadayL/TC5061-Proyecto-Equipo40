  240: primera salida 2024-10-01 14:04, última salida 2025-06-06 09:52,
  última llegada 2025-06-05 23:14:14; 909 salidas y 604 llegadas.
  400: primera salida 2025-06-09 18:23:16, última salida
  2026-02-22 10:15:10; 8,817 salidas y 10,013 llegadas.
  No hay días con actividad en ambas ni viajes entre ellas.

evidencia: >
  Notebook 1.2-co-target-analysis.ipynb, sección Estaciones 240 y 400.

accion: >
  Decidir si se tratan como una misma serie o como estaciones distintas
  después de revisar las diferencias de nombre y ubicación.
  No cambiar sus IDs automáticamente.

