name: mibici-mlops

x-artifacts-destination: &artifacts-destination s3://mlflow-artifacts
services:
  ds_workspace:
    build:
      context: .
      target: jupyter
    image: mibici-jupyter:local
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace/mibici
      - mibici_python:/opt/mibici-venv
      - uv_cache:/root/.cache/uv
    env_file: ./configs/env/jupyter.env
    working_dir: /workspace/mibici
    networks:
      - mlops_network
    depends_on:
      - mlflow

  mlflow:
    build:
      context: .
      target: mlflow
    image: kaggle-mlflow:local
    #container_name: mlflow_server
    env_file: ./configs/env/mlflow.env
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow:5000,localhost:5000,127.0.0.1:5000
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - *artifacts-destination
    networks:
      - mlops_network
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio-init:
    build:
      context: .
      target: mlflow
    env_file: ./configs/env/mlflow.env
    environment:
      MLFLOW_ARTIFACTS_DESTINATION: *artifacts-destination
    entrypoint: ["python", "-c"]
    command:
      - |
        import os
        from urllib.parse import urlsplit

        import boto3
        from botocore.config import Config
        from botocore.exceptions import ClientError

        bucket = urlsplit(os.environ["MLFLOW_ARTIFACTS_DESTINATION"]).netloc
        s3 = boto3.client(
            "s3",
            endpoint_url=os.environ["MLFLOW_S3_ENDPOINT_URL"],
            config=Config(connect_timeout=2, read_timeout=3, retries={
                "mode": "standard", "total_max_attempts": 8,
            }),
        )
        try:
            s3.head_bucket(Bucket=bucket)
        except ClientError as error:
            if error.response["ResponseMetadata"]["HTTPStatusCode"] != 404:
                raise
            s3.create_bucket(Bucket=bucket)
        print(f"Bucket de artefactos listo: {bucket}", flush=True)
    networks:
      - mlops_network
    depends_on:
      - minio

  minio:
    build:
      context: .
      target: minio
    image: mibici-minio:2025-10-15
    #container_name: minio_server
    command: server /data --console-address ":9001"
    env_file: ./configs/env/minio.env
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mlops_network

  api:
    build:
      context: .
      target: api
    image: ghcr.io/chadayl/tc5061-proyecto-equipo40-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INFERENCE_URL: http://inference:8080/invocations
    depends_on:
      - inference
    networks:
      - mlops_network

  inference:
    build:
      context: .
      target: inference
      args:
        MODEL_DIR: build/serving
    image: mibici-inference:p1-v1
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - mlops_network

networks:
  mlops_network:
    driver: bridge
volumes:
  mlflow_data:
  minio_data:
  mibici_python:
  uv_cache:
